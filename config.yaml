llm:
  provider: "gemini"          # "gemini" | "cerebras"
  max_requests_per_run: 20    # hard cap on physical provider requests
  transient_503_retries: 0    # 0 or 1; HTTP 429 is never retried
  retry_delay_seconds: 2.0
  gemini:
    model: "gemini-3.6-flash"
  cerebras:
    model: "gpt-oss-120b"
    temperature: 0.5

semantic_scholar:
  results_per_query: 20
  max_total_papers: 40        # free-tier profile: ~9 clean LLM requests

paper_curator:
  batch_size: 8

synthesis:
  batch_size: 20

google_sheets:
  credentials_file: "credentials.json"
  sheet_id: ""

pipeline:
  max_agent_iterations: 10
  checkpoint_path: "data/session_checkpoint.json"
  log_level: "INFO"

langfuse:
  enabled: true
  flush_at: 1              # send after each event (good for short CLI runs)
  flush_interval: 1        # max seconds to wait before sending a batch
  flush_after_llm_call: true
